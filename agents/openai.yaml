interface:
  display_name: "cg product image"
  short_description: "Builds English prompts that make an image-generation AI bring out the true surface material (matte, gloss, metallic, chrome, anodized, etc.) of an existing product photo without changing shape, color, or logos. Works in Japanese, Chinese, and English."
  default_prompt: "Use /cg-product-image to write a prompt that improves the material look of this product photo. If the shooting environment, background, material, or other instructions are missing, ask for them together first. Reply in my language."
